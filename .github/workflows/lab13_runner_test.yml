name: Lab 13 - Self Hosted Runner Test

on:
  push:
    branches:
      - lab13-integration
  workflow_dispatch:

env:
  # EDIT: absolute path of the project on the self-hosted runner machine.
  PROJECT_DIR: C:\path\to\weather-daily-summary-classification

jobs:
  test-runner:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Check Python
        shell: powershell
        run: python --version

      - name: Check Git
        shell: powershell
        run: git --version

      - name: Check Docker
        shell: powershell
        run: docker info

      - name: Check Kubernetes
        shell: powershell
        run: kubectl get nodes

      - name: Check Project
        shell: powershell
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          if (-not (Test-Path "$env:PROJECT_DIR\config.yaml")) { throw "Project not found at $env:PROJECT_DIR" }
          if (-not (Test-Path "$env:PROJECT_DIR\venv\Scripts\python.exe")) { throw "venv missing in $env:PROJECT_DIR" }
          Write-Host "Project and venv found."
