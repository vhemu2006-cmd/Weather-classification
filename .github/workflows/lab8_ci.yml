name: Lab 8 - MLOps CI

on:
  push:
    branches: [main, master]
    paths:
      - "config.yaml"
      - "src/mlops_pipeline/**"
      - "requirements.txt"
      - "data/raw/weatherHistory.csv"
      - ".github/workflows/lab8_ci.yml"
  pull_request:
    paths:
      - "config.yaml"
      - "src/mlops_pipeline/**"
      - "requirements.txt"
      - "data/raw/weatherHistory.csv"
      - ".github/workflows/lab8_ci.yml"
  workflow_dispatch:

jobs:
  mlops-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Optional: a reachable MLflow server. Without it MLflow uses local ./mlruns.
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # A fresh CI checkout has no new_weather.csv, so --force trains anyway.
      # GitHub-hosted runners have no Kubernetes cluster, so --skip-deploy leaves
      # out the Docker/Kubernetes rollout (Lab 13 runs it on the self-hosted runner).
      - name: Run Weather Daily Summary MLOps Pipeline
        run: python src/mlops_pipeline/weather_prediction_pipeline.py --force --skip-deploy

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab8-ci-${{ github.run_number }}
          path: |
            artifacts/**
            reports/**
            logs/**
            outputs/**
          if-no-files-found: ignore
